<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3048"/>
      <stop offset="0.55" stop-color="#101C2C"/>
      <stop offset="1" stop-color="#080F18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#7CC4FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7CC4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>
    <!-- a flight route: dashed arc between two airports, data rows below -->
    <path d="M58 170 Q128 64 198 170" fill="none" stroke="#7CC4FF" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>
    <circle cx="58" cy="170" r="13" fill="#F4B49C"/>
    <circle cx="198" cy="170" r="13" fill="none" stroke="#7CC4FF" stroke-width="7"/>
    <path d="M128 92 l20 12 -20 12 4 -12z" fill="#F2F5FA"/>
    <rect x="70" y="196" width="116" height="7" rx="3.5" fill="#A9C7EA" opacity="0.55"/>
    <rect x="90" y="210" width="76" height="7" rx="3.5" fill="#A9C7EA" opacity="0.32"/>
    <rect x="8" y="8" width="240" height="110" fill="url(#gloss)"/>
  </g>
</svg>
