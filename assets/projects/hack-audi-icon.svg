<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2C33"/>
      <stop offset="0.55" stop-color="#121216"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#FF2D44" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF2D44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B80F2A"/>
      <stop offset="1" stop-color="#FF4D5E"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D9DCE2"/>
      <stop offset="1" stop-color="#8E939C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>
    <!-- progression gauge: four arc segments, three lit -->
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M71.4 184.6 A80 80 0 0 1 52.3 118.8" stroke="url(#seg)"/>
      <path d="M57.7 97.4 A80 80 0 0 1 103.6 51.8" stroke="url(#seg)"/>
      <path d="M126 48 A80 80 0 0 1 188.9 79.4" stroke="url(#seg)"/>
      <path d="M200.2 98.5 A80 80 0 0 1 184.6 184.6" stroke="#FFFFFF" stroke-opacity="0.16"/>
    </g>
    <!-- level chevron -->
    <path d="M92 104 L128 164 L164 104" fill="none" stroke="url(#silver)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="78" r="9" fill="#FF4D5E"/>
    <!-- gloss -->
    <path d="M8 8 H248 V112 C190 128 70 128 8 104 Z" fill="url(#gloss)"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
</svg>
